packages:
  - "components"
  - "components/*"

# versions shared between workspace packages, referenced as "catalog:"
catalog:
  "@custom-elements-manifest/analyzer": ^0.11.0
  "@open-wc/testing": ^5.0.0
  "@rollup/plugin-commonjs": ^29.0.3
  "@rollup/plugin-replace": ^6.0.3
  "@types/mocha": ^10.0.10
  "@web/dev-server-esbuild": ^2.0.0
  "@web/dev-server-rollup": ^1.0.0
  "@web/test-runner": ^1.0.0
  "esbuild": ^0.28.2
  "micromark": ^4.0.3
  "micromark-extension-gfm": ^3.0.0
  "micromark-extension-math": ^3.1.0
  "tslib": ^2.8.1
  "typescript": ^7.0.2
  "wink-eng-lite-web-model": ^1.8.1
  "wink-nlp": ^2.4.0

allowBuilds:
  esbuild: true
  # postinstall only installs a wasm fallback when the native binding (an
  # optional dependency) is missing
  rs-module-lexer: false
