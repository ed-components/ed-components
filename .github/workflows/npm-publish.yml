# This workflow builds and publishes the package to npm when a version tag is pushed
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

defaults:
  run:
    working-directory: ./components

# npm trusted publishing: authenticate with GitHub OIDC instead of a token,
# and attest the provenance of the package
permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # version is read from packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          # no dependency cache when publishing: a poisoned cache would end up
          # in the published package
          package-manager-cache: false
      - run: pnpm i --frozen-lockfile
      - name: Check the tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm build
      # pnpm pack replaces catalog: and workspace: versions, then npm publish
      # authenticates with trusted publishing
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - run: npm publish "$RUNNER_TEMP"/ed-components-ed-components-*.tgz --access public
